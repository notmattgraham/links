<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#fafaf6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Links" />
  <title>Links</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #fafaf6;
      --bg-card:   #f4f2ec;
      --ink:       #0d0c0a;
      --ink-soft:  #2d2a24;
      --ink-muted: #7a7568;
      --hairline:  #e2dccf;

      --display: 'Geist', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      --body:    'Inter Tight', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      background: var(--bg);
    }

    body {
      background: var(--bg);
      color: var(--ink-soft);
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100dvh;
    }

    button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; text-align: left; }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: calc(28px + env(safe-area-inset-top)) 20px calc(96px + env(safe-area-inset-bottom));
    }

    h1 {
      font-family: var(--display);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink);
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .list { list-style: none; }

    .item + .item { margin-top: 10px; }

    .copy {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 15px 16px 15px 18px;
      background: #fff;
      border: 1px solid var(--hairline);
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(13, 12, 10, 0.04), 0 6px 14px -8px rgba(13, 12, 10, 0.18);
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .copy:active {
      transform: scale(0.98);
      background: var(--bg-card);
      box-shadow: 0 1px 1px rgba(13, 12, 10, 0.04);
    }
    .copy.flash {
      background: var(--ink);
      border-color: var(--ink);
    }

    .text { flex: 1; min-width: 0; }

    .name {
      display: block;
      font-family: var(--display);
      font-weight: 600;
      font-size: 17px;
      letter-spacing: -0.015em;
      color: var(--ink);
      line-height: 1.25;
      transition: color 0.2s ease;
    }

    .url {
      display: block;
      margin-top: 2px;
      font-size: 13px;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.2s ease;
    }

    .icon {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-card);
      color: var(--ink-soft);
      transition: background 0.2s ease, color 0.2s ease;
    }
    .icon svg { width: 18px; height: 18px; display: block; }

    .copy.flash .name { color: var(--bg); }
    .copy.flash .url { color: rgba(250, 250, 246, 0.6); }
    .copy.flash .icon { background: rgba(250, 250, 246, 0.16); color: var(--bg); }

    .empty {
      padding: 56px 0;
      text-align: center;
      color: var(--ink-muted);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom));
      transform: translate(-50%, 16px);
      max-width: calc(100% - 40px);
      background: var(--ink);
      color: var(--bg);
      font-family: var(--display);
      font-weight: 500;
      font-size: 15px;
      padding: 12px 20px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>

<div class="wrap">
  <h1>Links</h1>
  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden>No links yet.</p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// Add links here. Order below is the order shown on the page.
var LINKS = [
  { name: '1st Phorm Main Link',  url: 'https://1stphorm.com/?a_aid=notmattgraham' },
  { name: '1st Phorm App',        url: 'https://1stphorm.com/pages/1st-phorm-app-access?a_aid=notmattgraham' },
  { name: 'Phormula-1 Clear',     url: 'https://1stphorm.com/products/phormula-1-clear?a_aid=notmattgraham' },
  { name: 'Phormula-1',           url: 'https://1stphorm.com/products/phormula-1?a_aid=notmattgraham' },
  { name: 'Level-1',              url: 'https://1stphorm.com/products/level-1?a_aid=notmattgraham' },
  { name: '1st Phorm Magnesium',  url: 'https://1stphorm.com/products/magnesium?a_aid=notmattgraham' },
  { name: 'Phorm Energy',         url: 'https://1stphorm.com/products/phorm-energy?a_aid=notmattgraham' },
  { name: 'Brick',                url: 'https://www.getbrick.app/MATT46388' },
  { name: '10K Playbook',         url: 'https://notmattgraham.com/playbook/' },
  { name: '30 Day Challenge',     url: 'https://notmattgraham.com/30/' },
  { name: 'Skinny Fat Fix',       url: 'https://notmattgraham.com/skinnyfat' },
  { name: 'Speaking Product',     url: 'https://www.notmattgraham.com/yap' },
];

(function () {
  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var toastEl = document.getElementById('toast');
  var toastTimer;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
  }

  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text) {
    // Some in-app browsers reject the async API even over https, so always fall back.
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function () {
        if (!legacyCopy(text)) throw new Error('copy failed');
      });
    }
    return legacyCopy(text) ? Promise.resolve() : Promise.reject(new Error('copy failed'));
  }

  var ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>';
  var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function shortUrl(u) {
    return u.replace(/^https?:\/\//, '').replace(/^www\./, '');
  }

  emptyEl.hidden = LINKS.length > 0;

  LINKS.forEach(function (link) {
    var li = document.createElement('li');
    li.className = 'item';

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy';
    btn.setAttribute('aria-label', 'Copy link: ' + link.name);

    var text = document.createElement('span');
    text.className = 'text';
    var name = document.createElement('span');
    name.className = 'name';
    name.textContent = link.name;
    var url = document.createElement('span');
    url.className = 'url';
    url.textContent = shortUrl(link.url);
    text.appendChild(name);
    text.appendChild(url);

    var icon = document.createElement('span');
    icon.className = 'icon';
    icon.setAttribute('aria-hidden', 'true');
    icon.innerHTML = ICON_COPY;

    btn.appendChild(text);
    btn.appendChild(icon);

    var resetTimer;
    btn.addEventListener('click', function () {
      copyText(link.url).then(function () {
        toast('Copied: ' + link.name);
        btn.classList.add('flash');
        icon.innerHTML = ICON_CHECK;
        clearTimeout(resetTimer);
        resetTimer = setTimeout(function () {
          btn.classList.remove('flash');
          icon.innerHTML = ICON_COPY;
        }, 1100);
      }, function () {
        toast('Copy failed');
      });
    });

    li.appendChild(btn);
    listEl.appendChild(li);
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
